name: Test all inputs - Azure ACR Build
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          service_principal: fake-service-principal
          service_principal_password: fake-password
          tenant: fake-tenant-id
          registry: myregistry
          repository: myrepo/myimage
          git_access_token: fake-git-token
          image: myimage
          tag: latest
          branch: main
          folder: .
          dockerfile: ./Dockerfile
          build_args: '{"BUILD_VERSION":"1.0.0"}'
        continue-on-error: true
      - name: Assert action was attempted
        run: |
          echo "Action step completed (may have failed due to missing real Azure credentials)"
          echo "PASS: all inputs were passed to the action"
