name: Test ACR build with optional inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          service_principal: fake-service-principal
          service_principal_password: fake-password
          tenant: fake-tenant-id
          registry: fakeregistry
          repository: myrepo
          git_access_token: fake-git-token
          image: myimage
          tag: v1.0.0
          branch: main
          folder: src
          dockerfile: Dockerfile
          build_args: '[{"KEY":"VALUE"}]'

      - name: Assert action ran and failed gracefully (no real Azure credentials)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully as expected (no real Azure credentials)"
          elif [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded (real Azure credentials were available)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
